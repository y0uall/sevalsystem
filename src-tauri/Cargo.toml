[package]
name = "sevalsys"
version = "2.0.0"
description = "SEVALSystem – Desktop-Anwendung zur quartalsweisen Lieferantenbewertung"
authors = ["Michael Schlosser"]
license = "MIT"
edition = "2024"
# repository = "https://github.com/<dein-benutzername>/sevalsystem"

[lib]
name = "sevalsys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.10.2", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
rusqlite = { version = "0.38.0", features = ["bundled"] }
chrono = { version = "0.4.44", features = ["serde"] }
directories = "6.0.0"
base64 = "0.22.1"
bcrypt = "0.18.0"
rust_xlsxwriter = "0.94"
