<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="80" fill="#1e3a5f"/>

  <!-- Inner glow/highlight -->
  <rect x="24" y="24" width="464" height="464" rx="64" fill="#2563eb" opacity="0.3"/>

  <!-- Clipboard base -->
  <rect x="120" y="100" width="272" height="340" rx="24" fill="#ffffff" stroke="#0f172a" stroke-width="8"/>

  <!-- Clipboard clip -->
  <rect x="196" y="76" width="120" height="48" rx="12" fill="#f59e0b" stroke="#0f172a" stroke-width="6"/>
  <circle cx="256" cy="100" r="12" fill="#0f172a"/>

  <!-- Evaluation lines -->
  <rect x="160" y="180" width="140" height="16" rx="8" fill="#64748b"/>
  <rect x="160" y="220" width="180" height="16" rx="8" fill="#64748b"/>
  <rect x="160" y="260" width="120" height="16" rx="8" fill="#64748b"/>
  <rect x="160" y="300" width="160" height="16" rx="8" fill="#64748b"/>

  <!-- Checkmark circle -->
  <circle cx="360" cy="360" r="72" fill="#22c55e" stroke="#0f172a" stroke-width="8"/>

  <!-- Checkmark -->
  <path d="M320 360 L348 388 L400 332" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle shine effect -->
  <ellipse cx="200" cy="140" rx="60" ry="20" fill="#ffffff" opacity="0.15"/>
</svg>
