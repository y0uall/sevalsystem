name: Release

# Baut Installer für Windows und Linux, sobald ein Tag "v*" gepusht wird,
# und hängt sie als Entwurf an ein GitHub-Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Systempakete installieren (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libglib2.0-dev libssl-dev patchelf \
            libayatana-appindicator3-dev

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Tauri-Build & Release-Entwurf
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "SEVALSystem ${{ github.ref_name }}"
          releaseBody: "Installer für Windows (.msi/.exe) und Linux (.deb/.AppImage). Standard-Login: admin / admin123 – bitte sofort ändern."
          releaseDraft: true
          prerelease: false
